<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감사합니다 — 안그수 강사님께</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #fdf8f2;
      --warm-brown: #7c5c3e;
      --soft-brown: #a8855e;
      --light-tan: #e8d5bc;
      --accent: #c9956a;
      --text-dark: #3d2b1f;
      --text-mid: #6b4c35;
      --text-light: #9a7a62;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--cream);
      color: var(--text-dark);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Falling petals ── */
    .petals-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Hero ── */
    .hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 4rem 2rem 6rem;
      text-align: center;
      z-index: 1;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(201,149,106,0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .badge {
      display: inline-block;
      font-family: 'Noto Serif KR', serif;
      font-size: 0.75rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      color: var(--soft-brown);
      border: 1px solid var(--light-tan);
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      margin-bottom: 2.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.3s forwards;
    }

    .hero-to {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 300;
      color: var(--text-light);
      letter-spacing: 0.15em;
      margin-bottom: 0.8rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.5s forwards;
    }

    .hero-name {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 600;
      color: var(--warm-brown);
      line-height: 1.2;
      margin-bottom: 1.2rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.7s forwards;
    }

    .hero-sub {
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 300;
      color: var(--text-mid);
      letter-spacing: 0.08em;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 0.9s forwards;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 3.5rem;
      opacity: 0;
      animation: fadeUp 0.8s 1.1s forwards;
    }
    .divider span { font-size: 1.2rem; color: var(--accent); }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      width: 80px;
      background: linear-gradient(to right, transparent, var(--light-tan));
    }
    .divider::after { background: linear-gradient(to left, transparent, var(--light-tan)); }

    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: var(--text-light);
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      opacity: 0;
      animation: fadeUp 0.8s 1.8s forwards;
    }
    .scroll-hint .arrow {
      width: 20px;
      height: 20px;
      border-right: 1.5px solid var(--soft-brown);
      border-bottom: 1.5px solid var(--soft-brown);
      transform: rotate(45deg);
      animation: bounce 1.5s infinite;
    }

    /* ── Letter section ── */
    .letter-section {
      position: relative;
      z-index: 1;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 2rem 8rem;
    }

    .letter-card {
      background: #fff9f4;
      border: 1px solid var(--light-tan);
      border-radius: 16px;
      padding: clamp(2rem, 5vw, 4rem) clamp(2rem, 6vw, 5rem);
      box-shadow: 0 8px 40px rgba(124,92,62,0.08), 0 2px 8px rgba(124,92,62,0.05);
      position: relative;
    }

    .letter-card::before {
      content: '❝';
      position: absolute;
      top: 1.5rem;
      left: 2rem;
      font-size: 4rem;
      color: var(--light-tan);
      font-family: Georgia, serif;
      line-height: 1;
    }

    .letter-date {
      text-align: right;
      font-size: 0.82rem;
      color: var(--text-light);
      letter-spacing: 0.1em;
      margin-bottom: 2rem;
    }

    .letter-greeting {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.05rem;
      font-weight: 400;
      color: var(--warm-brown);
      margin-bottom: 1.8rem;
    }

    .letter-body {
      font-size: clamp(0.95rem, 2vw, 1.05rem);
      line-height: 2.1;
      color: var(--text-dark);
      white-space: pre-line;
      word-break: keep-all;
      min-height: 12rem;

      /* 편집 가능 스타일 */
      outline: none;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .letter-body[contenteditable="true"] {
      background: rgba(201,149,106,0.05);
      padding: 1rem;
      border: 1px dashed var(--light-tan);
      cursor: text;
    }

    .letter-body[contenteditable="true"]:focus {
      background: rgba(201,149,106,0.1);
      border-color: var(--accent);
    }

    .edit-hint {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      color: var(--text-light);
      margin-top: 0.6rem;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
      transition: color 0.2s;
    }
    .edit-hint:hover { color: var(--accent); }
    .edit-hint svg { width: 14px; height: 14px; }

    .letter-signature {
      text-align: right;
      margin-top: 3rem;
      font-family: 'Noto Serif KR', serif;
      font-size: 1rem;
      font-weight: 400;
      color: var(--warm-brown);
      line-height: 1.8;
    }

    /* ── Footer ── */
    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1rem 3rem;
      font-size: 0.78rem;
      color: var(--text-light);
      letter-spacing: 0.08em;
    }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translateY(0); }
      50%       { transform: rotate(45deg) translateY(5px); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .letter-card { padding: 2rem 1.5rem; }
      .letter-card::before { font-size: 2.5rem; }
    }
  </style>
</head>
<body>

<canvas class="petals-canvas" id="petalCanvas"></canvas>

<!-- Hero -->
<section class="hero">
  <div class="badge">THANK YOU</div>
  <p class="hero-to">소중한 가르침을 주신</p>
  <h1 class="hero-name">안그수 강사님께</h1>
  <p class="hero-sub">진심을 담아 감사의 마음을 전합니다</p>
  <div class="divider"><span>✦</span></div>
  <div class="scroll-hint">
    <div class="arrow"></div>
  </div>
</section>

<!-- Letter -->
<section class="letter-section">
  <div class="letter-card">
    <p class="letter-date">2025년 12월</p>
    <p class="letter-greeting">안그수 강사님께,</p>

    <div
      class="letter-body"
      id="letterBody"
      contenteditable="false"
    >여기에 감사 메시지를 작성해 주세요.

강사님과 함께한 시간 동안 많은 것을 배우고 느꼈습니다.
앞으로도 강사님의 가르침을 마음에 새기며 나아가겠습니다.

항상 건강하시고 행복하시길 바랍니다.</div>

    <button class="edit-hint" id="editBtn" onclick="toggleEdit()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
      <span id="editLabel">메시지 수정하기</span>
    </button>

    <div class="letter-signature">
      코리아아이티<br>
      12월 국비 교육생 일동
    </div>
  </div>
</section>

<footer class="footer">
  — 감사합니다 —
</footer>

<script>
  /* ── 편집 토글 ── */
  function toggleEdit() {
    const body = document.getElementById('letterBody');
    const label = document.getElementById('editLabel');
    const isEditing = body.contentEditable === 'true';

    if (isEditing) {
      body.contentEditable = 'false';
      label.textContent = '메시지 수정하기';
    } else {
      body.contentEditable = 'true';
      body.focus();
      label.textContent = '수정 완료';
    }
  }

  /* ── 꽃잎 애니메이션 ── */
  const canvas = document.getElementById('petalCanvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const COLORS = ['#e8c9aa', '#f2dbc5', '#dbb894', '#c9956a', '#f5e6d3'];

  class Petal {
    constructor() { this.reset(true); }

    reset(initial = false) {
      this.x     = Math.random() * canvas.width;
      this.y     = initial ? Math.random() * canvas.height * -1 : -20;
      this.size  = Math.random() * 8 + 4;
      this.speedY = Math.random() * 1 + 0.4;
      this.speedX = (Math.random() - 0.5) * 0.6;
      this.angle  = Math.random() * Math.PI * 2;
      this.spin   = (Math.random() - 0.5) * 0.04;
      this.opacity = Math.random() * 0.5 + 0.2;
      this.color  = COLORS[Math.floor(Math.random() * COLORS.length)];
    }

    update() {
      this.y     += this.speedY;
      this.x     += this.speedX + Math.sin(this.y / 60) * 0.4;
      this.angle += this.spin;
      if (this.y > canvas.height + 20) this.reset();
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.globalAlpha = this.opacity;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, this.size, this.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  const petals = Array.from({ length: 55 }, () => new Petal());

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    petals.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
