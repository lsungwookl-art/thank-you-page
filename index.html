<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>롤링페이퍼 — 안그수 강사님께</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
    }

    /* ── 헤더 ── */
    .header {
      background: #3d2b1f;
      color: #fff;
      text-align: center;
      padding: 3.5rem 2rem 4rem;
      position: relative;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,149,106,0.35) 0%, transparent 65%);
    }
    .header-emoji { font-size: 2rem; margin-bottom: 1rem; display: block; }
    .header-sub {
      font-size: 0.78rem;
      letter-spacing: 0.35em;
      color: #e8a87c;
      margin-bottom: 0.7rem;
      font-weight: 300;
    }
    .header-title { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 700; margin-bottom: 0.6rem; }
    .header-title em { color: #e8a87c; font-style: normal; }
    .header-desc { font-size: 0.88rem; color: rgba(255,255,255,0.55); font-weight: 300; }
    .header-from {
      display: inline-block;
      margin-top: 1.4rem;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 0.35rem 1.1rem;
      border-radius: 999px;
    }
    .tape {
      position: absolute;
      bottom: -11px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px; height: 22px;
      background: rgba(232,168,124,0.5);
      border-radius: 3px;
      z-index: 5;
    }

    /* ── 보드 ── */
    .board {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 6rem;
      columns: 280px;
      column-gap: 1.2rem;
    }

    /* ── 카드 ── */
    /*
      색상 클래스:
        c0 = 노랑   c1 = 분홍   c2 = 하늘
        c3 = 연초록  c4 = 주황   c5 = 보라
        c6 = 베이지  c7 = 연분홍
    */
    .card {
      break-inside: avoid;
      margin-bottom: 1.2rem;
      border-radius: 4px;
      padding: 1.4rem 1.3rem 1.6rem;
      position: relative;
      box-shadow: 3px 4px 14px rgba(0,0,0,0.13);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px) rotate(0deg) !important;
      box-shadow: 5px 8px 22px rgba(0,0,0,0.16);
      z-index: 2;
    }
    .card:nth-child(odd)  { transform: rotate(-0.8deg); }
    .card:nth-child(even) { transform: rotate(0.7deg); }
    .card:nth-child(3n)   { transform: rotate(-1.3deg); }
    .card:nth-child(4n)   { transform: rotate(1.1deg); }

    /* 상단 테이프 */
    .card::before {
      content: '';
      position: absolute;
      top: -10px; left: 50%;
      transform: translateX(-50%);
      width: 46px; height: 20px;
      border-radius: 3px;
      opacity: 0.5;
    }

    .card.c0 { background: #fff9c4; } .card.c0::before { background: #f9c74f; }
    .card.c1 { background: #ffd6d6; } .card.c1::before { background: #f48c9f; }
    .card.c2 { background: #d4f0ff; } .card.c2::before { background: #74c0fc; }
    .card.c3 { background: #d7f5d0; } .card.c3::before { background: #74c69d; }
    .card.c4 { background: #ffe0c4; } .card.c4::before { background: #ffa94d; }
    .card.c5 { background: #e8d5ff; } .card.c5::before { background: #b197fc; }
    .card.c6 { background: #fff0d9; } .card.c6::before { background: #ffc078; }
    .card.c7 { background: #fce4ec; } .card.c7::before { background: #f48fb1; }

    .card-name {
      font-family: 'Gaegu', cursive;
      font-size: 1rem;
      font-weight: 700;
      color: #444;
      margin-bottom: 0.5rem;
    }
    .card-name::before { content: '✏️ '; }

    .card-msg {
      font-family: 'Gaegu', cursive;
      font-size: 1.08rem;
      line-height: 1.8;
      color: #333;
      white-space: pre-wrap;
      word-break: keep-all;
    }

    .footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.78rem;
      color: #bbb;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>

<header class="header">
  <span class="header-emoji">🌸</span>
  <p class="header-sub">ROLLING PAPER</p>
  <h1 class="header-title"><em>안그수</em> 강사님께</h1>
  <p class="header-desc">함께한 시간 동안 정말 감사했습니다 💛</p>
  <span class="header-from">코리아아이티 12월 국비 교육생 일동</span>
  <div class="tape"></div>
</header>

<!-- =====================================================
  ✅ 카드 추가 방법
  아래 예시를 복사해서 원하는 만큼 붙여넣으세요.
  색상 클래스: c0(노랑) c1(분홍) c2(하늘) c3(초록)
               c4(주황) c5(보라) c6(베이지) c7(연분홍)
====================================================== -->
<div class="board">

  <!-- 카드 예시 — 아래를 복사해서 반복하세요 -->
  <div class="card c0">
    <div class="card-name">홍길동</div>
    <div class="card-msg">강사님 정말 감사합니다!
덕분에 많이 배웠어요 😊</div>
  </div>

  <div class="card c1">
    <div class="card-name">김철수</div>
    <div class="card-msg">어려운 내용도 쉽게 설명해 주셔서
너무 좋았습니다. 항상 건강하세요!</div>
  </div>

  <div class="card c2">
    <div class="card-name">이영희</div>
    <div class="card-msg">강사님 덕분에 자신감이 생겼어요.
앞으로도 잘 부탁드립니다 🙏</div>
  </div>

  <!-- 여기에 카드를 계속 추가하세요 ↓ -->

</div>

<footer class="footer">— 소중한 시간을 함께해 주셔서 감사합니다 —</footer>

</body>
</html>
